[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "lorag"
version = "0.1.0"
description = "Ask questions over local documents and Apple Notes"
requires-python = ">=3.11"
dependencies = [
    "langchain==1.4.0",
    "langchain-chroma==1.1.0",
    "langchain-core==1.6.3",
    "langchain-ollama==1.1.0",
    "langchain-text-splitters==1.1.2",
    "chromadb==1.5.9",
    "pypdf==6.18.1",
]

[project.scripts]
lorag = "lorag.cli:main"

[tool.setuptools.packages.find]
include = ["lorag*"]
